[project]
name = "nlp-demo"
version = "0.1.0"
description = "Juego Semantle en español para varios jugadores"
readme = "README.md"
authors = [
    { name = "mick2332-q", email = "ayalamigue908@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=1.31.0",
    "jinja2>=3.1.0",
    "numpy>=2.5.3",
    "python-dotenv>=1.0.1",
    "qrcode>=8.2",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
# Es una aplicación que se ejecuta desde la raíz, no un paquete instalable.
# Sin esto, uv intentaría construir un paquete desde src/ y fallaría.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
